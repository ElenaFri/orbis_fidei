coverage:
  status:
    patch:
      default:
        # Vue templates and static locale catalogs are intentionally excluded
        # from Vitest instrumentation; keep patch gating realistic for UI-only diffs.
        target: 70%
        threshold: 1%
    project:
      default:
        target: 90%
        threshold: 1%

ignore:
  - '**/src/main.ts'
  - 'apps/api/src/app.ts'
  - 'workers/aggregator/src/runOnce.ts'
  - '**/*.test.ts'
  - 'apps/web/src/i18n/**'
  - 'apps/web/src/components/**'
  - 'apps/web/src/views/**'
  - 'packages/database/prisma/migrations/**'
  - 'packages/database/prisma/schema.prisma'
  - 'packages/types/src/**'
  - '**/vitest.config.ts'
  - '**/vitest.workspace.ts'
