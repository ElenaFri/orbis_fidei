# Les fichiers de traduction ont la même structure de clés dans les 3 langues :
# la « duplication » détectée est structurelle et non actionnable (on ne peut pas
# factoriser du texte traduit sans perdre le contenu par langue).
#
# Les fichiers de test (mocks Prisma factices par domaine) partagent une structure
# CRUD similaire par conception : Vitest/vi.mock impose que chaque fichier de test
# définisse son mock de manière autonome (les tentatives de factorisation via
# vi.hoisted() se sont révélées fragiles avec les imports locaux). On privilégie ici
# la lisibilité et l'isolation de chaque test à la stricte absence de duplication.
sonar.cpd.exclusions=apps/web/src/i18n/**,**/*.test.ts
